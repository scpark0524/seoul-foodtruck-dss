name: Realtime Collector

# ────────────────────────────────────────────────────────
# 서울 실시간 도시데이터 자동 수집 (매시간)
# - cron 시간은 UTC 기준 (한국시간 = UTC+9)
# - 매시간 5분 정각 실행: '5 * * * *'
# - 수동 실행도 가능: Actions 탭 > Run workflow
# ────────────────────────────────────────────────────────

on:
  schedule:
    - cron: '5 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: '실행 모드'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - test
          - check-keys

permissions:
  contents: write

concurrency:
  group: realtime-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run collector
        env:
          SEOUL_API_KEY_1: ${{ secrets.SEOUL_API_KEY_1 }}
          SEOUL_API_KEY_2: ${{ secrets.SEOUL_API_KEY_2 }}
          SEOUL_API_KEY_3: ${{ secrets.SEOUL_API_KEY_3 }}
          SEOUL_API_KEY_4: ${{ secrets.SEOUL_API_KEY_4 }}
          SEOUL_API_QUOTA_1: ${{ secrets.SEOUL_API_QUOTA_1 || '1000' }}
          SEOUL_API_QUOTA_2: ${{ secrets.SEOUL_API_QUOTA_2 || '1000' }}
          SEOUL_API_QUOTA_3: ${{ secrets.SEOUL_API_QUOTA_3 || '1000' }}
          SEOUL_API_QUOTA_4: ${{ secrets.SEOUL_API_QUOTA_4 || '1000' }}
          TZ: Asia/Seoul
        run: |
          cd scripts
          MODE="${{ github.event.inputs.mode || 'full' }}"
          if [ "$MODE" = "test" ]; then
            python collect_realtime.py --test
          elif [ "$MODE" = "check-keys" ]; then
            python collect_realtime.py --check-keys
          else
            python collect_realtime.py
          fi

      - name: Commit & push collected data
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Collector"

          # raw/realtime + logs stage
          git add raw/realtime/ logs/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No new data to commit"
          else
            TIMESTAMP=$(TZ='Asia/Seoul' date '+%Y-%m-%d %H:%M KST')
            git commit -m "Auto: realtime collected at $TIMESTAMP"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push
          fi

      - name: Upload logs as artifact (실패 시)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
